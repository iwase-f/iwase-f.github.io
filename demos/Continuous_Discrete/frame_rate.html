<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>連続と離散の境界（FPSデモ）</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        #controls {
            background: white;
            padding: 15px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            text-align: center;
            width: 400px;
        }
        canvas {
            background: #222;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        input[type="range"] {
            width: 100%;
            margin: 15px 0;
        }
        .fps-display {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }
        .description {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div id="controls">
        <h3>コマ数（FPS）の操作</h3>
        <p class="description">スライダーを動かして、滑らかさが消える境界を探してください。</p>
        <input type="range" id="fpsSlider" min="1" max="60" value="60">
        <div class="fps-display">現在のFPS: <span id="fpsValue">60</span> コマ/秒</div>
    </div>

    <canvas id="simulationCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById('simulationCanvas');
        const ctx = canvas.getContext('2d');
        const fpsSlider = document.getElementById('fpsSlider');
        const fpsValue = document.getElementById('fpsValue');

        // ボールの初期状態
        let ball = {
            x: 50,
            y: 50,
            vx: 5,
            vy: 0,
            radius: 20,
            color: '#00ffcc'
        };

        const gravity = 0.5;
        // 反発係数を-1に設定（減衰なし。永遠に同じ高さまで跳ね返る）
        const bounce = -1; 
        
        let currentFPS = parseInt(fpsSlider.value);

        // スライダーの操作
        fpsSlider.addEventListener('input', (e) => {
            currentFPS = parseInt(e.target.value);
            fpsValue.textContent = currentFPS;
        });

        // 物理演算のループ（裏側の現実は常に滑らかに進む）
        function updatePhysics() {
            ball.vy += gravity;
            ball.x += ball.vx;
            ball.y += ball.vy;

            // 床でのバウンド（めり込みを防止して座標を補正）
            if (ball.y + ball.radius > canvas.height) {
                ball.y = canvas.height - ball.radius;
                ball.vy *= bounce;
            }

            // 左右の壁でのバウンド（めり込みを厳密に防止）
            if (ball.x + ball.radius > canvas.width) {
                ball.x = canvas.width - ball.radius;
                ball.vx *= -1;
            } else if (ball.x - ball.radius < 0) {
                ball.x = ball.radius;
                ball.vx *= -1;
            }
        }

        // 物理演算は一定間隔（約16.6ms = 60fps相当）で計算し続ける
        setInterval(updatePhysics, 1000 / 60);

        // 描画処理
        function drawScene() {
            // 背景をダークグレーで塗りつぶす（前のコマを消す）
            ctx.fillStyle = '#222';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // ボールを描画
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = ball.color;
            ctx.fill();
            ctx.closePath();
        }

        // 描画ループ（requestAnimationFrameによる安定した時間管理）
        let lastRenderTime = 0;
        
        function renderLoop(timestamp) {
            requestAnimationFrame(renderLoop);
            
            // スライダーで設定されたFPSに基づく描画間隔（ミリ秒）
            const renderInterval = 1000 / currentFPS;
            
            // 前回の描画から十分な時間が経過していたら描画を実行
            if (timestamp - lastRenderTime >= renderInterval) {
                drawScene();
                lastRenderTime = timestamp;
            }
        }

        // 描画ループを開始
        requestAnimationFrame(renderLoop);

    </script>
</body>
</html>
