<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>連続と離散の境界（正n角形デモ）</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        #controls {
            background: white;
            padding: 15px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            text-align: center;
            width: 400px;
        }
        canvas {
            background: #222;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        input[type="range"] {
            width: 100%;
            margin: 15px 0;
        }
        .n-display {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }
        .description {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div id="controls">
        <h3>頂点の数（角数）の操作</h3>
        <p class="description">スライダーを右に動かして、カクカクした線が「滑らかな円」に見え始める境界を探してください。</p>
        <input type="range" id="nSlider" min="3" max="100" value="3">
        <div class="n-display">現在の図形: 正 <span id="nValue">3</span> 角形</div>
    </div>

    <canvas id="geometryCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById('geometryCanvas');
        const ctx = canvas.getContext('2d');
        const nSlider = document.getElementById('nSlider');
        const nValue = document.getElementById('nValue');

        // 現在の角数（初期値は3）
        let currentN = parseInt(nSlider.value, 10);

        // スライダーの操作イベント（FPSデモと同じ方式）
        nSlider.addEventListener('input', (e) => {
            currentN = parseInt(e.target.value, 10);
            nValue.textContent = currentN;
        });

        // 描画処理
        function drawScene() {
            // 背景をダークグレーで塗りつぶす（前のコマを消す）
            ctx.fillStyle = '#222';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 150;

            // 図形の輪郭線を描画
            ctx.beginPath();
            for (let i = 0; i < currentN; i++) {
                const angle = (i * 2 * Math.PI) / currentN - Math.PI / 2;
                const x = centerX + radius * Math.cos(angle);
                const y = centerY + radius * Math.sin(angle);
                
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.closePath();
            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 3;
            ctx.stroke();

            // 離散的な「点（頂点）」を強調して描画
            for (let i = 0; i < currentN; i++) {
                const angle = (i * 2 * Math.PI) / currentN - Math.PI / 2;
                const x = centerX + radius * Math.cos(angle);
                const y = centerY + radius * Math.sin(angle);
                
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#ff0066';
                ctx.fill();
                ctx.closePath();
            }
        }

        // 描画ループ（FPSデモと同じく、常に画面を更新し続ける）
        function renderLoop() {
            drawScene();
            requestAnimationFrame(renderLoop);
        }

        // ループ開始
        requestAnimationFrame(renderLoop);
    </script>
</body>
</html>
