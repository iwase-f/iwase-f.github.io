<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Exponential Scale Keyboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { 
            display: flex; flex-direction: column; align-items: center; 
            font-family: sans-serif; margin-top: 50px; background-color: #f0f0f0; 
            touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
        }
        #keyboard { position: relative; display: flex; margin-top: 20px;}
        .key { display: flex; justify-content: center; align-items: flex-end; padding-bottom: 8px; font-weight: bold; box-sizing: border-box; border-radius: 0 0 5px 5px; cursor: pointer; font-size: 1rem; }
        
        /* 全体を80%に縮小 */
        .white { width: 48px; height: 200px; background-color: white; border: 1px solid #333; color: #333; z-index: 1; }
        .white.active { background-color: #e0e0e0; }
        .black { width: 32px; height: 120px; background-color: #333; color: white; position: absolute; z-index: 2; }
        .black.active { background-color: #666; }
        
        /* 黒鍵の配置も80%で再計算 */
        .cs { left: 32px; } 
        .ds { left: 80px; } 
        .fs { left: 176px; } 
        .gs { left: 224px; } 
        .as { left: 272px; }
        
        .instructions { margin-bottom: 20px; text-align: center; padding: 0 10px;}
        
        /* 追加：オーディオ有効化ボタンのスタイル */
        #enableAudioBtn {
            background-color: #007acc; color: white; border: none; 
            padding: 12px 24px; font-size: 1.1rem; font-weight: bold; 
            border-radius: 5px; cursor: pointer; margin-bottom: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #enableAudioBtn:hover { background-color: #005f9e; }

        #status {
            padding: 5px 10px; background-color: #ffcccc; color: #cc0000;
            border-radius: 5px; font-size: 0.9rem; margin-bottom: 10px;
            display: none; /* 初期状態では隠す */
        }
        #status.ready { background-color: #ccffcc; color: #006600; display: block; }
    </style>
</head>
<body>

    <div class="instructions">
        <h2>Exponential Scale Keyboard</h2>
        <p>従来の平均律（等比数列による周波数の増加）です。</p>
        
        <button id="enableAudioBtn">サウンドを有効にする</button>
        <div id="status">準備完了！鍵盤をタッチしてください</div>
    </div>

    <div id="keyboard">
        <div class="key white" id="key-a">C4</div><div class="key white" id="key-s">D</div>
        <div class="key white" id="key-d">E</div><div class="key white" id="key-f">F</div>
        <div class="key white" id="key-g">G</div><div class="key white" id="key-h">A</div>
        <div class="key white" id="key-j">B</div><div class="key white" id="key-k">C5</div>

        <div class="key black cs" id="key-w"></div><div class="key black ds" id="key-e"></div>
        <div class="key black fs" id="key-t"></div><div class="key black gs" id="key-y"></div>
        <div class="key black as" id="key-u"></div>
    </div>

    <script>
        // 全体を window.onload で包み、確実な初期化を保証する
        window.onload = function() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            let audioCtx, compressor;
            let isAudioUnlocked = false; 
            const activeOscillators = {};

            const keyMap = {
                'a': { freq: 261.63 }, 'w': { freq: 277.18 }, 's': { freq: 293.66 },
                'e': { freq: 311.13 }, 'd': { freq: 329.63 }, 'f': { freq: 349.23 },
                't': { freq: 369.99 }, 'g': { freq: 392.00 }, 'y': { freq: 415.30 },
                'h': { freq: 440.00 }, 'u': { freq: 466.16 }, 'j': { freq: 493.88 }, 'k': { freq: 523.25 }
            };

            // ダブルタップズーム防止
            let lastTouch = 0;
            document.addEventListener('touchend', (e) => {
                const now = window.performance.now();
                if (now - lastTouch <= 300) e.preventDefault();
                lastTouch = now;
            }, { passive: false });

            // ボタンのクリックイベントでオーディオを解除
            const enableAudioBtn = document.getElementById('enableAudioBtn');
            const statusEl = document.getElementById('status');

            enableAudioBtn.addEventListener('click', () => {
                if (isAudioUnlocked) return;
                
                audioCtx = new AudioContext();
                
                compressor = audioCtx.createDynamicsCompressor();
                compressor.threshold.setValueAtTime(-12, audioCtx.currentTime);
                compressor.knee.setValueAtTime(0, audioCtx.currentTime);
                compressor.ratio.setValueAtTime(20, audioCtx.currentTime);
                compressor.attack.setValueAtTime(0.001, audioCtx.currentTime); 
                compressor.release.setValueAtTime(0.1, audioCtx.currentTime);
                compressor.connect(audioCtx.destination);

                // iOSの制限を解除するための無音再生
                const buffer = audioCtx.createBuffer(1, 1, audioCtx.sampleRate);
                const source = audioCtx.createBufferSource();
                source.buffer = buffer; 
                source.connect(audioCtx.destination); 
                source.start(0);

                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                
                isAudioUnlocked = true;
                
                // UIの更新
                enableAudioBtn.style.display = 'none';
                statusEl.classList.add('ready');
            });

            function playNote(key) {
                if (!isAudioUnlocked || !keyMap[key] || activeOscillators[key]) return;
                
                // バックグラウンド等でサスペンドされた場合の復帰処理
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.type = 'sine'; 
                osc.frequency.value = keyMap[key].freq;
                
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.05);
                
                osc.connect(gainNode); 
                gainNode.connect(compressor); 
                osc.start();
                
                activeOscillators[key] = { osc, gainNode };
                
                const keyEl = document.getElementById('key-' + key);
                if(keyEl) keyEl.classList.add('active');
            }

            function stopNote(key) {
                if (activeOscillators[key]) {
                    const { osc, gainNode } = activeOscillators[key];
                    gainNode.gain.setValueAtTime(gainNode.gain.value, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                    osc.stop(audioCtx.currentTime + 0.1);
                    delete activeOscillators[key];
                    
                    const keyEl = document.getElementById('key-' + key);
                    if(keyEl) keyEl.classList.remove('active');
                }
            }

            window.addEventListener('keydown', (e) => { playNote(e.key.toLowerCase()); });
            window.addEventListener('keyup', (e) => { stopNote(e.key.toLowerCase()); });

            document.querySelectorAll('.key').forEach(keyElement => {
                const key = keyElement.id.split('-')[1];
                keyElement.addEventListener('pointerdown', (e) => { 
                    playNote(key); 
                    keyElement.setPointerCapture(e.pointerId); 
                });
                keyElement.addEventListener('pointerup', (e) => { 
                    stopNote(key); 
                    keyElement.releasePointerCapture(e.pointerId); 
                });
                keyElement.addEventListener('pointerleave', () => stopNote(key));
                keyElement.addEventListener('pointercancel', () => stopNote(key));
            });
        };
    </script>
</body>
</html>
