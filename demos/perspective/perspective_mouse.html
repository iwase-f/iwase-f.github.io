<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遠近法・投影シミュレーター</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            background-color: #f0f0f0;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            min-width: 250px;
        }
        .control-group {
            margin-bottom: 15px;
        }
        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        select, input[type="range"] {
            width: 100%;
        }
        .info {
            font-size: 12px;
            color: #555;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="ui-panel">
        <div class="control-group">
            <label for="objectType">オブジェクト</label>
            <select id="objectType">
                <option value="cube">立方体 (Cube)</option>
                <option value="sphere">球 (Sphere)</option>
                <option value="cylinder">円柱 (Cylinder)</option>
            </select>
        </div>

        <div class="control-group">
            <label for="projectionType">投影方法</label>
            <select id="projectionType">
                <option value="perspective">透視投影 (Perspective)</option>
                <option value="orthographic">平行投影 (Orthographic)</option>
            </select>
        </div>

        <div class="control-group">
            <label for="fovSlider">視野角 (FOV): <span id="fovValue">50</span></label>
            <input type="range" id="fovSlider" min="10" max="150" value="50">
        </div>

        <div class="info">
            [操作方法]<br>
            左ドラッグ: 回転<br>
            右ドラッグ: 平行移動<br>
            スクロール: ズーム
        </div>
    </div>

    <div id="canvas-container"></div>

    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 1. 基本設定（シーン、レンダラー） ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xdddddd);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // --- 2. カメラの設定 ---
        const aspect = window.innerWidth / window.innerHeight;
        const frustumSize = 15; // 平行投影用のサイズ

        // 透視投影カメラ（デフォルト）
        const perspCamera = new THREE.PerspectiveCamera(50, aspect, 0.1, 1000);
        perspCamera.position.set(10, 10, 15);

        // 平行投影カメラ
        const orthoCamera = new THREE.OrthographicCamera(
            frustumSize * aspect / -2, frustumSize * aspect / 2,
            frustumSize / 2, frustumSize / -2,
            0.1, 1000
        );
        orthoCamera.position.copy(perspCamera.position);

        let activeCamera = perspCamera;

        // --- 3. マウスコントロール (OrbitControls) ---
        let controls = new OrbitControls(activeCamera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // --- 4. 環境（ライト、グリッド、軸） ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        const gridHelper = new THREE.GridHelper(30, 30, 0x888888, 0xcccccc);
        scene.add(gridHelper);

        const axesHelper = new THREE.AxesHelper(5); // 赤:X, 緑:Y, 青:Z
        scene.add(axesHelper);

        // --- 5. オブジェクト（メッシュ）の設定 ---
        const material = new THREE.MeshStandardMaterial({ 
            color: 0x2194ce, 
            roughness: 0.4, 
            metalness: 0.1 
        });
        
        let currentMesh = new THREE.Mesh(new THREE.BoxGeometry(4, 4, 4), material);
        currentMesh.position.y = 2; // グリッドの上に置く
        scene.add(currentMesh);

        // ジオメトリを切り替える関数
        function updateGeometry(type) {
            scene.remove(currentMesh);
            let geometry;
            if (type === 'cube') geometry = new THREE.BoxGeometry(4, 4, 4);
            else if (type === 'sphere') geometry = new THREE.SphereGeometry(2.5, 32, 32);
            else if (type === 'cylinder') geometry = new THREE.CylinderGeometry(2, 2, 4, 32);
            
            currentMesh = new THREE.Mesh(geometry, material);
            currentMesh.position.y = type === 'sphere' ? 2.5 : 2;
            scene.add(currentMesh);
        }

        // --- 6. UIイベントの連携 ---
        
        // オブジェクト切り替え
        document.getElementById('objectType').addEventListener('change', (e) => {
            updateGeometry(e.target.value);
        });

        // 投影方法の切り替え
        document.getElementById('projectionType').addEventListener('change', (e) => {
            const isPerspective = e.target.value === 'perspective';
            const fovSlider = document.getElementById('fovSlider');

            if (isPerspective) {
                perspCamera.position.copy(activeCamera.position);
                perspCamera.quaternion.copy(activeCamera.quaternion);
                activeCamera = perspCamera;
                fovSlider.disabled = false;
            } else {
                orthoCamera.position.copy(activeCamera.position);
                orthoCamera.quaternion.copy(activeCamera.quaternion);
                
                // 平行投影に切り替えた際、現在のカメラ距離に基づいて表示スケールを調整
                const distance = activeCamera.position.distanceTo(controls.target);
                const halfFrustum = distance * Math.tan(THREE.MathUtils.degToRad(perspCamera.fov) / 2);
                orthoCamera.left = -halfFrustum * aspect;
                orthoCamera.right = halfFrustum * aspect;
                orthoCamera.top = halfFrustum;
                orthoCamera.bottom = -halfFrustum;
                orthoCamera.updateProjectionMatrix();
                
                activeCamera = orthoCamera;
                fovSlider.disabled = true; // 平行投影ではFOVは無効
            }
            
            // コントロールのカメラを更新
            controls.dispose();
            controls = new OrbitControls(activeCamera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
        });

        // 視野角(FOV)の変更
        document.getElementById('fovSlider').addEventListener('input', (e) => {
            const fov = parseFloat(e.target.value);
            document.getElementById('fovValue').textContent = fov;
            if (activeCamera.isPerspectiveCamera) {
                activeCamera.fov = fov;
                activeCamera.updateProjectionMatrix();
            }
        });

        // ウィンドウリサイズ対応
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const newAspect = width / height;

            renderer.setSize(width, height);

            if (activeCamera.isPerspectiveCamera) {
                activeCamera.aspect = newAspect;
                activeCamera.updateProjectionMatrix();
            } else {
                const distance = activeCamera.position.distanceTo(controls.target);
                const halfFrustum = distance * Math.tan(THREE.MathUtils.degToRad(perspCamera.fov) / 2);
                activeCamera.left = -halfFrustum * newAspect;
                activeCamera.right = halfFrustum * newAspect;
                activeCamera.updateProjectionMatrix();
            }
        });

        // --- 7. アニメーションループ ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // Damping用
            renderer.render(scene, activeCamera);
        }
        animate();
    </script>
</body>
</html>
